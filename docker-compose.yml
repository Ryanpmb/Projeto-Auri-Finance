services:
  java-app:
    image: maven:3.8.6-openjdk-11
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.m2:/root/.m2
    command: tail -f /dev/null
    depends_on:
      - mysql-db
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=app_db
      - DB_USER=devuser
      - DB_PASSWORD=devpassword

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: senha123
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
